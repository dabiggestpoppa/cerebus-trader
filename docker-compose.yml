version: "3.9"

services:
  trader:
    build: .
    container_name: cerebus-core
    ports:
      - "8080:8000"
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - ./configs:/app/configs
    restart: unless-stopped
    environment:
      - ENVIRONMENT=prod
      - PYTHONUNBUFFERED=1
    env_file:
      - .env

