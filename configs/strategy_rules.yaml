# CEREBUS FX v5.0 — Symmetry Trap Strategy Rules
# Source: strategy context.txt (April 2026 validation)

# ─── SIGNAL VALIDATION ────────────────────────────────────────────────────────
allowed_symbols:
  - EURUSD
  - GBPUSD
  - USDCHF
  - USDJPY
  - AUDUSD
  - NZDUSD

allowed_strategies:
  - CEREBUS_IMPULSE
  - CEREBUS_REBALANCE

max_signal_age_seconds: 60
duplicate_window_seconds: 5
fallback_webhook_only_mode: true
allowed_sessions: [LONDON, NY, OVERLAP, ASIA]
vision_confidence_threshold: 0.85

# ─── SESSION TIMES (EST) ──────────────────────────────────────────────────────
asian_range_window:  "19:00 - 03:00"   # 7PM - 3AM EST
bias_window:         "03:00 - 09:00"   # 3AM - 9AM EST
hard_exit_time_est:  "12:00"           # Prop firm mode; "off" for personal accounts

# ─── V5 ATOMIC PARAMETERS ─────────────────────────────────────────────────────
# All values in pips.
# base_trigger: impulse break of Asian H/L must exceed this (+ body >= 4.5p)
# density_zone: [min, max] pip pullback from peak to trigger entry
# a_leg_target: atomic run target pips from entry (close 80% here)
# tier_ranges: [T1_max, T2_max, NO-GO_above]
# min_body_pips: minimum candle body for ANY signal condition (anchor, entry, EWS)

min_body_pips: 4.5

atomic_params:
  EURUSD:
    tier_ranges:   [20, 30, 45]
    base_trigger:  [12, 15, 19]      # T1, T2, T3
    density_zone:  [[8,12],[10,14],[13,17]]
    a_leg_target:  [10, 14, 18]
    atomic_unit:   [10, 12, 15]      # Universal pip block per tier

  GBPUSD:
    tier_ranges:   [24, 34, 55]
    base_trigger:  [14, 18, 23]
    density_zone:  [[13,15],[17,19],[22,24]]
    a_leg_target:  [14, 18, 23]
    atomic_unit:   [14, 18, 23]

  USDCHF:
    tier_ranges:   [19, 29, 50]
    base_trigger:  [11, 15, 20]
    density_zone:  [[10,12],[14,16],[19,21]]
    a_leg_target:  [11, 15, 20]
    atomic_unit:   [11, 15, 20]

  USDJPY:
    tier_ranges:   [28, 42, 65]
    base_trigger:  [16, 22, 29]
    density_zone:  [[15,17],[21,23],[28,30]]
    a_leg_target:  [14, 22, 29]
    atomic_unit:   [14, 22, 29]

  AUDUSD:
    tier_ranges:   [22, 33, 52]
    base_trigger:  [13, 17, 22]
    density_zone:  [[12,14],[16,18],[21,23]]
    a_leg_target:  [13, 17, 22]
    atomic_unit:   [13, 17, 22]

  NZDUSD:
    tier_ranges:   [25, 36, 55]
    base_trigger:  [15, 20, 26]
    density_zone:  [[14,16],[19,21],[25,27]]
    a_leg_target:  [15, 20, 26]
    atomic_unit:   [15, 20, 26]

# ─── EXECUTION ────────────────────────────────────────────────────────────────
fde_target_usd: 50          # Fixed Dollar Expectancy per trade
a_leg_close_pct: 80         # % of position closed at A-leg target
sl_be_buffer_pips: 2        # SL moved to entry + this after A-leg hit
max_entries_per_session: 2

# ─── FILTERS ──────────────────────────────────────────────────────────────────
# Overfilled filter: if daily range exceeds threshold by 9AM -> stand down
overfilled_t1_t2_pips: 40
overfilled_t3_pips: 50

# First Impulse Predictor (3AM-4AM EST): early tier upgrade
first_impulse_predictor:
  rule_1: {early_range_lt: 10, impulse_gte: 12, upgrade_to: T2, confidence: 0.91}
  rule_2: {early_range_lt: 15, impulse_gte: 18, upgrade_to: T3, confidence: 0.89}
  rule_3: {early_range_lt: 20, impulse_gte: 25, upgrade_to: NOGO, confidence: 0.94}

# EWS window (minutes after entry)
ews_window_min_mins: 30
ews_window_max_mins: 60

# Thursday Rule: false anchor (price back inside Asian range in 30m) -> wait for opposite
thursday_rule: true

# Post-12PM Full Spectrum rules (personal accounts only)
post_12pm:
  eurusd_t3_max_target_pips: 20   # No new extremes, cap B-leg at 20p
  gbpusd_ews_window_max_mins: 90  # Extended EWS for afternoon grind
  asian_session_trigger_reduction_pct: 20  # Post-5PM: reduce all thresholds 20%
