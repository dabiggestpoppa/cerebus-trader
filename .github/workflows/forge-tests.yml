name: FORGE Tests

on:
  push:
    branches: [forge]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - run: python -m pytest -q

  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        # Closure repair (GAP-01): the frozen gate G-D1 names "empty
        # Postgres+pgvector -> current schema", so the acceptance database
        # must be Postgres WITH pgvector. pgvector/pgvector:pg16 is the
        # official pgvector image on the same postgres:16 base — additive
        # capability only; jobs, env vars and tests are unchanged.
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: forge
          POSTGRES_PASSWORD: forge_ci_password
          POSTGRES_DB: forge_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U forge"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      FORGE_DATABASE_ENABLED: "1"
      FORGE_DATABASE_URL: postgresql+psycopg2://forge:forge_ci_password@localhost:5432/forge_test
      FORGE_TEST_DATABASE_URL: postgresql+psycopg2://forge:forge_ci_password@localhost:5432/forge_test
      FORGE_MIGRATION_COMPATIBILITY_REQUIRED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - name: Install PostgreSQL 16 client tools
        run: |
          sudo apt-get update -y
          sudo apt-get install -y postgresql-client-16
          echo "/usr/lib/postgresql/16/bin" >> $GITHUB_PATH
      - name: Assert PostgreSQL 16 client/server compatibility
        run: |
          echo "=== pg_dump ===" && pg_dump --version
          echo "=== pg_restore ===" && pg_restore --version
          echo "=== server version ==="
          SERVER_VER=$(PGPASSWORD=forge_ci_password psql -h localhost -p 5432 -U forge -d forge_test -tAc "SHOW server_version")
          echo "server: $SERVER_VER"
          SERVER_MAJOR=$(echo "$SERVER_VER" | cut -d. -f1)
          DUMP_MAJOR=$(pg_dump --version | awk '{print $3}' | cut -d. -f1)
          RESTORE_MAJOR=$(pg_restore --version | awk '{print $3}' | cut -d. -f1)
          echo "majors: server=$SERVER_MAJOR dump=$DUMP_MAJOR restore=$RESTORE_MAJOR"
          [ "$SERVER_MAJOR" = "16" ] || { echo "ERROR: PostgreSQL server major version is $SERVER_MAJOR, expected 16" >&2; exit 1; }
          [ "$DUMP_MAJOR" = "16" ] || { echo "ERROR: pg_dump major version is $DUMP_MAJOR, expected 16" >&2; exit 1; }
          [ "$RESTORE_MAJOR" = "16" ] || { echo "ERROR: pg_restore major version is $RESTORE_MAJOR, expected 16" >&2; exit 1; }
      - name: Full suite against live PostgreSQL
        run: python -m pytest -q
      - name: PostgreSQL integration evidence
        run: python -m pytest -v tests/test_forge_postgres_integration.py
      - name: PostgreSQL II.3 identity & session evidence
        run: python -m pytest -v tests/test_forge_postgres_integration.py -k TestPostgresIdentitySession
